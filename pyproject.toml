[project]
name = "chemsafety"
version = "0.1.0"
description = "LLM-ассистент по химической безопасности на основе паспортов безопасности (SDS)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
